<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Annapurna">
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#e8811a"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a8f"/>
      <stop offset="1" stop-color="#e5484f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#14161b"/>
  <!-- Peak shaped as an "A": the mountain Annapurna, rising from the bowl -->
  <path fill="url(#peak)" fill-rule="evenodd"
        d="M256 92 L392 316 L120 316 Z M256 236 L226 300 L286 300 Z"/>
  <!-- snow cap -->
  <path fill="#f6f1e6" d="M256 92 L300 164 L280 154 L264 170 L248 152 L230 166 L212 164 Z"/>
  <!-- bowl rim -->
  <rect x="96" y="300" width="320" height="30" rx="15" fill="#f6f1e6"/>
  <!-- bowl -->
  <path fill="url(#bowl)" d="M108 330 H404 C398 398 336 438 256 438 C176 438 114 398 108 330 Z"/>
  <!-- foot -->
  <rect x="206" y="430" width="100" height="18" rx="9" fill="#e8811a"/>
</svg>
