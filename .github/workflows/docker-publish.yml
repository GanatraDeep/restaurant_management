name: Publish Docker images

# Builds and publishes the F Cartel backend/web images to this repository
# owner's GitHub Container Registry (ghcr.io/<owner>/...), so a server can
# run a pre-built, version-pinned image instead of building from source.
#
# Each architecture is built on a NATIVE runner (ubuntu-24.04-arm for arm64)
# and the two digests are merged into one multi-arch (amd64 + arm64) tag
# afterwards. Uses the automatic `secrets.GITHUB_TOKEN` — no
# manually-created registry credential needed.

# A push to master publishes only :edge and :sha-<commit>, so unreleased code can never replace the image a
# version tag (and every install pinned to it) points at. A version tag (vX.Y.Z) or a manual run with a
# version publishes :<version> and :latest.
on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - "packages/types/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 1.0.0). Also pushed as :latest. Leave empty to publish :edge only."
        required: false
        default: ""

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
      # What the images are tagged and announced as (sha-<commit> for a push
      # to master, else the version) — baked into the backend as APP_VERSION
      # so Admin → Releases can tell which one is running.
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clones carry no tags, so `git describe` would silently
          # return nothing. fetch-depth: 0 pulls history + tags.
          fetch-depth: 0
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # No version: a plain push to master. Build and publish :edge only.
          if [ -z "$VERSION" ]; then
            VERSION="edge"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "edge" ]; then
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          # GHCR image paths must be lowercase.
          echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [fcartel-backend, fcartel-web]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: fcartel-backend
            dockerfile: apps/backend/Dockerfile
          - image: fcartel-web
            dockerfile: apps/web/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # web needs the backend URL baked in at build time (Next.js rewrites
          # resolve at build). APP_VERSION is only used by the backend image.
          build-args: |
            BACKEND_URL=http://backend:4000
            APP_VERSION=${{ needs.version.outputs.tag }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.slug }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: [fcartel-backend, fcartel-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$VERSION" = "edge" ]; then
            TAGS="-t $IMAGE:edge -t $IMAGE:sha-${GITHUB_SHA::7}"
          else
            TAGS="-t $IMAGE:$VERSION -t $IMAGE:latest"
          fi
          docker buildx imagetools create $TAGS \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "Published \`$IMAGE:$TAG\` — use \`FCARTEL_VERSION=$TAG\` for a first install (deploy/README.md)." >> "$GITHUB_STEP_SUMMARY"

  # Tells the production server a new version exists. Nothing is deployed:
  # it shows up in Admin → Releases, where a super admin decides. Skipped
  # unless both repository secrets are set (Settings → Secrets → Actions):
  #   RELEASE_WEBHOOK_URL     https://fcartel.divtech.cloud/api/v1/releases/announce
  #   RELEASE_WEBHOOK_SECRET  same value as RELEASE_WEBHOOK_SECRET in the server's deploy/.env
  announce:
    needs: [version, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Announce to production
        env:
          URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "RELEASE_WEBHOOK_URL / RELEASE_WEBHOOK_SECRET not set — skipping the announcement."
            exit 0
          fi
          BODY=$(jq -cn \
            --arg tag "$TAG" \
            --arg sha "$GITHUB_SHA" \
            --arg msg "$(git log -1 --format=%B "$GITHUB_SHA" | head -c 1900)" \
            --arg author "$(git log -1 --format=%an "$GITHUB_SHA")" \
            --arg url "$REPO_URL/commit/$GITHUB_SHA" \
            '{tag: $tag, commitSha: $sha, message: $msg, author: $author, url: $url}')
          T=$(date +%s)
          SIG=$(printf '%s.%s' "$T" "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
          curl -fsS --retry 3 --retry-delay 5 -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-FCartel-Signature: t=$T,v1=$SIG" \
            --data "$BODY"
